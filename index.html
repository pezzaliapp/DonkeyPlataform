<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Donkey Platform — pezzaliAPP</title>
  <meta name="description" content="Un piccolo platform ispirato al 1981: sali le piattaforme, evita i barili, salva la giornata. PWA installabile, offline-ready." />
  <meta name="theme-color" content="#0f0f13" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <style>
    :root{
      --bg:#0f0f13; --panel:#171922; --card:#1e2230; --accent:#ffcc00; --accent2:#f54747;
      --text:#e9eef5; --muted:#a7b0c2; --btn:#252c3d; --border:#2b3245;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial}
    header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px;background:linear-gradient(180deg,#121521,#0f111a)}
    .brand{display:flex;gap:10px;align-items:center}
    .brand img{width:28px;height:28px;border-radius:6px}
    .brand h1{margin:0;font-size:16px;letter-spacing:.4px}
    .hud{display:flex;gap:14px;align-items:center;font-variant-numeric:tabular-nums;}
    .hud span{opacity:.9}
    main{display:flex;flex-direction:column;gap:10px;align-items:center;padding:10px}
    #wrapper{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px;max-width:820px;width:100%}
    #canvas{display:block;margin:0 auto;background:#0b0d14;border-radius:8px;width:100%;height:auto;aspect-ratio: 4 / 3;image-rendering:pixelated}
    .bar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:8px}
    .btn{border:1px solid var(--border);background:var(--btn);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600}
    .btn:active{transform:translateY(1px)}
    .group{display:flex;gap:8px;align-items:center}
    #mobile{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
    .tbtn{border:1px solid var(--border);background:#1c2232;padding:14px;border-radius:10px;text-align:center;font-weight:700;user-select:none}
    .tbtn:active{filter:brightness(1.1)}
    .pill{font-size:12px;color:var(--muted)}
    footer{padding:12px 16px;color:var(--muted);text-align:center}
    .blink{animation:blink 1.2s infinite}
    @keyframes blink {50%{opacity:.2}}
    @media (min-width: 820px){
      #canvas{max-width:800px}
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icons/icon-192.png" alt="icon">
      <h1>Donkey Platform — 1981 reimagined</h1>
    </div>
    <div class="hud">
      <span>🏆 Punteggio: <strong id="score">000000</strong></span>
      <span>❤️ Vite: <strong id="lives">3</strong></span>
      <span>🗼 Livello: <strong id="level">1</strong></span>
    </div>
  </header>

  <main>
    <div id="wrapper">
      <canvas id="canvas" width="320" height="240"></canvas>
      <div class="bar">
        <div class="group">
          <button id="btnPlay" class="btn">▶️ Gioca/Pausa</button>
          <button id="btnRestart" class="btn">🔄 Restart</button>
          <button id="btnHelp" class="btn">❔ Guida</button>
        </div>
        <div class="pill">⌨️ Frecce + Z (salto) • 📱 Touch sotto</div>
      </div>
      <div id="mobile">
        <div class="tbtn" data-k="ArrowLeft">◀︎</div>
        <div class="tbtn" data-k="ArrowUp">▲</div>
        <div class="tbtn" data-k="KeyZ">⤴︎</div>
        <div class="tbtn" data-k="ArrowDown">▼</div>
        <div class="tbtn" data-k="ArrowRight">▶︎</div>
      </div>
    </div>
  </main>

  <footer>
    © 2025 pezzaliAPP — PWA offline‑ready. Ispirato ai classici arcade del 1981. Non affiliato a marchi registrati.
  </footer>

  <script type="module" src="js/game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
</body>
</html>
