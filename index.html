<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Donkey Platform — iPhone</title>
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="DonkeyPlatform">
  <style>
    html,body{margin:0;height:100svh;background:#0b0d14;color:#e9eef5;touch-action:none;overscroll-behavior:none}
    #myCanvas{display:block;margin:0 auto;image-rendering:pixelated}
    .hud-touch{position:fixed;left:0;right:0;bottom:12px;display:flex;gap:10px;justify-content:center;z-index:10;pointer-events:auto}
    .hud-touch button{-webkit-tap-highlight-color:transparent;padding:14px 16px;border-radius:12px;border:1px solid #394050;background:#1c2232;color:#e9eef5;font-weight:700;min-width:64px}
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <canvas id="myCanvas" width="1510" height="685"></canvas>
  <script type="module" src="./main.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js'));
    }
  </script>

<div id="err" style="position:fixed;left:0;right:0;top:0;display:none;background:rgba(0,0,0,.7);color:#ff9b9b;padding:8px 12px;font:12px/1.3 monospace;z-index:9999"></div>
<script>
  // Show JS errors on-screen (utile su iPhone PWA)
  window.onerror = function(msg, src, line, col, err){
    const el = document.getElementById('err');
    el.style.display='block';
    el.textContent = (msg||'error') + ' @ ' + (line||'?') + ':' + (col||'?');
  };
</script>
</body>
</html>
