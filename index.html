<html>
    <head>
        <title>Donkey Kong</title>
        <link href="styles.css" type="text/css" rel="stylesheet">
    
<style>
  html,body{margin:0;height:100%;background:#0b0d14;touch-action:none;overscroll-behavior:none}
  .hud-touch{position:fixed;left:0;right:0;bottom:12px;display:flex;gap:10px;justify-content:center;z-index:10}
  .hud-touch button{
    -webkit-tap-highlight-color:transparent;
    padding:14px 16px;border-radius:12px;border:1px solid #394050;
    background:#1c2232;color:#e9eef5;font-weight:700;min-width:64px
  }
  .start-overlay{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.35); z-index:20; pointer-events:auto;
  }
  .start-overlay.hidden{ display:none; }
  .start-btn{
    -webkit-tap-highlight-color:transparent;
    font-weight:800; letter-spacing:.4px; font-size:18px;
    padding:14px 22px; border-radius:14px; border:1px solid #394050;
    background:#1c2232; color:#e9eef5;
  }
</style>

</head>
    <body>
        <canvas id="myCanvas" width="1510" height="685" style="position: absolute;"></canvas>

<div id="startOverlay" class="start-overlay">
  <button id="btnStart" class="start-btn">▶︎ Start</button>
</div>

        <script type="module" src="./main.js"></script>
    </body>
</html>
